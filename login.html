<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Memória Digital</title>

    <link rel="stylesheet" href="css/login-criarconta.css">
</head>

<body>

    <main class="container">

        <section class="caixa">

            <div class="cabecalho">

                <span class="logo">Memória Digital</span>

                <h1>Bem-vindo de volta</h1>

                <p>
                    Entre para continuar compartilhando suas memórias.
                </p>

            </div>


            <form action="/login" method="POST" class="formulario">

                <div class="campo">

                    <label for="usuario">Nome de usuário</label>

                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu nome de usuário"
                        autocomplete="username" required>

                </div>


                <div class="campo">

                    <label for="senha">Senha</label>

                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                        autocomplete="current-password" required>

                </div>


                <button type="submit" class="botao">
                    Entrar
                </button>

            </form>


            <div class="link-cadastro">

                <p>
                    Ainda não possui uma conta?
                    <a href="criar-conta.html">Criar conta</a>
                </p>

            </div>

        </section>

    </main>

</body>

</html>
